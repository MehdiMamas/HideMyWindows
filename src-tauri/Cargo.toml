[package]
name = "hidemywindows"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Hide your windows from screen capture, screenshots and recordings."
default-run = "hidemywindows"

[lib]
name = "hidemywindows_lib"
# Desktop-only app: the binary links against the rlib. (The default template
# also emits staticlib/cdylib for mobile targets, which we don't ship.)
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { workspace = true }
serde_json = { workspace = true }
hmw-core = { path = "../hmw-core" }

[target.'cfg(windows)'.dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Registry",
]

[features]
# Enable this to see console output during development.
custom-protocol = ["tauri/custom-protocol"]
