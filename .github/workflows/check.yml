name: Check

# Fast validation on every push / PR: the frontend builds, Rust compiles and
# clippy is clean. Full installers are produced by release.yml on tags.

on:
  push:
    branches: ["main", "rewrite-tauri", "feat/**"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install frontend deps
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Test frontend
        run: npm test

      - name: Build payload (x64)
        shell: bash
        run: |
          cargo build -p hmw-payload --release --target x86_64-pc-windows-msvc
          mkdir -p src-tauri/resources
          cp target/x86_64-pc-windows-msvc/release/hmw_payload.dll src-tauri/resources/hmw_payload.dll

      - name: Rust format check
        run: cargo fmt --all -- --check

      - name: Build the 32-bit helper and payload
        shell: bash
        run: |
          rustup target add i686-pc-windows-msvc
          cargo build -p hmw-release -p hmw-payload --release --target i686-pc-windows-msvc
          cp target/i686-pc-windows-msvc/release/hmw-release.exe src-tauri/resources/hmw-release-x86.exe
          cp target/i686-pc-windows-msvc/release/hmw_payload.dll src-tauri/resources/hmw_payload_x86.dll

      - name: Test core and Windows capture status
        shell: pwsh
        run: |
          cargo test --locked -p hmw-core -- --test-threads=1 2>&1 | Tee-Object -Variable nativeTestOutput
          $nativeTestExit = $LASTEXITCODE
          @('### Windows native test output', '```text', ($nativeTestOutput -join "`n"), '```') | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          if ($nativeTestExit -ne 0) {
            $details = ($nativeTestOutput -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows native tests failed::$details"
          }
          exit $nativeTestExit

      - name: Build ARM64 protection payload
        shell: pwsh
        run: |
          rustup target add aarch64-pc-windows-msvc
          cargo build --locked -p hmw-payload --release --target aarch64-pc-windows-msvc 2>&1 | Tee-Object -Variable armBuildOutput
          $armBuildExit = $LASTEXITCODE
          if ($armBuildExit -ne 0) {
            $details = (($armBuildOutput | Select-Object -Last 30) -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=ARM64 protection build failed::$details"
          }
          exit $armBuildExit

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build app
        run: cargo build -p hidemywindows --release
