name: Release

# Build Windows installers for x64, x86 and ARM64 and publish a GitHub release.
# Triggered by pushing a version tag (e.g. v2.0.0) or run manually.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v2.0.0)"
        required: true
        default: "v2.0.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: x86
            target: i686-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the injected payload (${{ matrix.arch }})
        shell: bash
        run: |
          cargo build -p hmw-payload --release --target ${{ matrix.target }}
          mkdir -p src-tauri/resources
          cp "target/${{ matrix.target }}/release/hmw_payload.dll" src-tauri/resources/hmw_payload.dll

      - name: Build app + installer and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "HideMyWindows ${{ github.event.inputs.tag || github.ref_name }}"
          releaseBody: "See CHANGELOG.md for what changed. Download the installer for your architecture below."
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
