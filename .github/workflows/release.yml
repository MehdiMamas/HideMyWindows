name: Release

# Build Windows installers for x64, x86 and ARM64 and publish a GitHub release.
# Triggered by pushing a version tag (e.g. v2.0.0) or run manually.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v2.0.0)"
        required: true
        default: "v2.0.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: x86
            target: i686-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the injected payload (${{ matrix.arch }})
        shell: bash
        run: |
          cargo build -p hmw-payload --release --target ${{ matrix.target }}
          mkdir -p src-tauri/resources
          cp "target/${{ matrix.target }}/release/hmw_payload.dll" src-tauri/resources/hmw_payload.dll

      - name: Build the 32-bit helper and payload
        if: matrix.arch == 'x64'
        shell: bash
        run: |
          rustup target add i686-pc-windows-msvc
          cargo build -p hmw-release -p hmw-payload --release --target i686-pc-windows-msvc
          cp target/i686-pc-windows-msvc/release/hmw-release.exe src-tauri/resources/hmw-release-x86.exe
          cp target/i686-pc-windows-msvc/release/hmw_payload.dll src-tauri/resources/hmw_payload_x86.dll

      - name: Build app + installer and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Minisign key from `npm run tauri signer generate` (never commit the private key).
          # Without both secrets the release has no latest.json, so in-app updates cannot install.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "HideMyWindows ${{ github.event.inputs.tag || github.ref_name }}"
          releaseBody: "See CHANGELOG.md for what changed. Download the installer for your architecture below."
          # Publish only after all three installers finish successfully.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the complete release
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        with:
          script: |
            const fs = require('fs');
            const tag = process.env.RELEASE_TAG;
            const version = tag.replace(/^v/, '');
            const releases = await github.paginate(github.rest.repos.listReleases, {
              ...context.repo, per_page: 100
            });
            const release = releases.find(r => r.tag_name === tag);
            if (!release) throw new Error(`Missing draft release for ${tag}`);
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              ...context.repo, release_id: release.id, per_page: 100
            });
            for (const arch of ['x64', 'x86', 'arm64']) {
              const expected = `HideMyWindows_${version}_${arch}-setup.exe`;
              if (!assets.some(a => a.name === expected && a.size > 0)) {
                throw new Error(`Missing installer: ${expected}`);
              }
            }
            const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
            const marker = `## [${version}]`;
            const start = changelog.indexOf(marker);
            if (start < 0) throw new Error(`Missing changelog for ${version}`);
            const next = changelog.indexOf('\n## [', start + marker.length);
            const notes = changelog.slice(start, next < 0 ? undefined : next).trim();
            await github.rest.repos.updateRelease({
              ...context.repo, release_id: release.id, draft: false,
              body: notes + '\n\nDownload the installer for your architecture below.'
            });
