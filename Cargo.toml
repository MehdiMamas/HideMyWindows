[workspace]
resolver = "2"
members = ["hmw-core", "hmw-release", "payload", "src-tauri"]

[workspace.package]
version = "2.3.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/mehdimamas/hidemywindows"

[workspace.dependencies]
windows = "0.58"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Small, fast release binaries.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The payload runs inside other apps. Unwinding lets it catch its own panics
# and fail open instead of aborting the app it was loaded into.
[profile.payload]
inherits = "release"
panic = "unwind"
